<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		@import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap");
	</style>
</head>

<body>
	<div style="
		width: 100%;
		height: 100%;
		margin: 0 auto;
		padding: 20px;
		box-sizing: border-box;
		">
		<img src="https://example.com/static/images/logo.svg" alt="example_com_logo"
			style="width: 160px; height: 160px; margin: 0 auto; margin-top: 5px; display: block" />
			<p style="
			width: 340px;
			margin: 0 auto;
			margin-top: 18px;
			text-align: center;
			font-family: Montserrat, sans-serif;
			font-size: 20px;
			font-weight: 500;
			line-height: 30px;
			letter-spacing: -1.5%;
			color: #16a085;
		">
			Reset your password!
		</p>
		<p style="
			width: 340px;
			margin: 0 auto;
			margin-top: 30px;
			text-align: left;
			font-family: Montserrat, sans-serif;
			font-size: 15px;
			font-weight: 500;
			line-height: 23px;
			letter-spacing: -1.5%;
			color: #000000;
		">
			Hello, <b style="text-decoration: none; color:inherit;">{{ email }}</b>!<br />
			We have received a request to reset your account password.
			Please click the link below to complete the password reset process:
		</p>
		<a href="{{ reset_password_url }}" style="
			display: block;
			text-align: center;
			text-decoration: none;
			width: 340px;
			height: 40px;
			margin: 0 auto;
			margin-top: 20px;
			box-sizing: border-box;
			background-color: #16a085;
			border: none;
			border-radius: 25px;
			font-family: Montserrat, sans-serif;
			font-size: 20px;
			font-weight: 700;
			line-height: 40px;
			letter-spacing: -1.5%;
			color: white;
			text-decoration: none;
		">Reset Password
		</a>
		<p style="
			width: 340px;
			margin: 0 auto;
			margin-top: 40px;
			text-align: left;
			font-family: Montserrat, sans-serif;
			font-size: 15px;
			font-weight: 400;
			line-height: 23px;
			letter-spacing: -1.5%;
			color: #000000;
		">
			If you need additional assistance, or you did not make this request, please contact to
			<span style="font-weight: 800; text-decoration: none; color:inherit;">
				support@example.com
			</span>.
		</p>
	</div>
</body>

</html>
